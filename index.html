<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var targetObj = window;
          var currentFetch = window.fetch;
          var desc = {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(targetObj, 'fetch', desc);
          } catch (e) {}
          if (window.Window && window.Window.prototype) {
            try {
              Object.defineProperty(window.Window.prototype, 'fetch', desc);
            } catch (e) {}
          }
        } catch (err) {}
      })();
    </script>
    <title>Roshade</title>
    <link rel="icon" type="image/jpeg" href="/icon.jpg" />
    <link rel="apple-touch-icon" href="/icon.jpg" />
    <meta name="description" content="Elevate your Roblox experience with real-time ray tracing, ambient occlusion, liquid glass reflections, and effortless shader presets." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta property="og:description" content="Real-time ray tracing, ambient occlusion, glossy reflections, and effortless preset switching for Roblox." />

  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
